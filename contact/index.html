<p>
 Please fill the following Contact Form below and click <span style="font-weight: bold;">Send</span> to contact us for any information or
      inquiries.
    </p>

    <div class="mb-3">
      <form action="https://api.web3forms.com/submit" method="POST">
        <input
          type="hidden"
          name="access_key"
          value="bc7b5f5a-40a5-4627-9c49-b72f2ed0a43c"
        />
        <div class="form-group form-inline">
          <label class="sr-only" for="inputName"></label>
          <input
            bordercolor="red"
            type="text"
            name="name"
            class="form-control w-100"
            id="inputName"
            placeholder="Your name"
            required
          />
        </div>
        <br/>
        <div class="form-group form-inline">
          <label class="sr-only" for="inputEmail"></label>
          <input
            type="email"
            name="email"
            class="form-control w-100"
            id="inputEmail"
            placeholder="Your email"
            required
          />
        </div><br/>
        <div class="form-group">
          <label class="sr-only" for="inputMessage"></label>
          <textarea
            name="message"
            class="form-control"
            id="inputMessage"
            rows="5"
            placeholder="Your message"
            required
          ></textarea>
        </div><br>
        <button type="submit" class="btn">
          Send
        </button>
      </form>
    </div>

<script>
    let menu = document.getElementById('menu')
    if (menu) {
        menu.scrollLeft = localStorage.getItem("menu-scroll-position");
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>

    window.onscroll = function () {

            mybutton.style.visibility = "visible";
            mybutton.style.opacity = "1";
        } else {
            mybutton.style.visibility = "hidden";
            mybutton.style.opacity = "0";
        }
    };

<script>
    function toggleDarkMode(filename, addDark) {
        var parts = filename.split('-dark.');
        if (addDark) {
            var extensionIndex = filename.lastIndexOf('.');
            var basename = filename.substring(0, extensionIndex);
            var extension = filename.substring(extensionIndex);
            return basename + "-dark" + extension;
        } else {
            return parts.join('.');
        }
    }
    var imageElements = document.getElementsByClassName("toggleDarkMode");
    document.getElementById("theme-toggle").addEventListener("click", () => {
        if (document.body.className.includes("dark")) {
            document.body.classList.remove('dark');
            localStorage.setItem("pref-theme", 'light');
            for (var i = 0; i < imageElements.length; i++) {
                imageElements[i].src = toggleDarkMode(imageElements[i].src, false);
            }
        } else {
            document.body.classList.add('dark');
            localStorage.setItem("pref-theme", 'dark');
            for (var i = 0; i < imageElements.length; i++) {
                imageElements[i].src = toggleDarkMode(imageElements[i].src, true);
            }
        }

            setTimeout(() => {
                copybutton.innerHTML = 'copy';

            if ('clipboard' in navigator) {
                navigator.clipboard.writeText(codeblock.textContent);
